<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Роща</title>
<style>body{font:16px system-ui;background:#10131b;color:#edf0fa;max-width:1000px;margin:40px auto;padding:20px}button,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #596174;margin:5px;background:#202738;color:inherit}button{cursor:pointer;background:#445ae0}section{margin:24px 0;padding:20px;background:#191e2b;border-radius:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}article{background:#202738;padding:12px;border-radius:12px}img{width:100%;height:220px;object-fit:contain}small{display:block;color:#b7bfd2}#status{white-space:pre-wrap}a{color:#aebaff}[hidden]{display:none!important}article{min-width:0}article img{height:170px;cursor:zoom-in}article button{font-size:14px;padding:9px;margin:5px 0;width:100%}article input{box-sizing:border-box;width:100%;margin:5px 0}@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}article img{height:130px}}</style>
<h1>Роща</h1><p>Загружайте личные фото и публикуйте выбранные для оформления профиля.</p>
<section id="auth"><p>Первый вход: введите приглашение. Уже есть доступ? Нажмите «У меня есть логин».</p><input id="entry-code" placeholder="Код приглашения"><button id="next">Продолжить по коду</button><button onclick="document.getElementById('credentials').hidden=false">У меня есть логин</button><div id="credentials" hidden><input id="email" placeholder="Логин: латиница, цифры, _" autocomplete="username"><input id="password" type="password" placeholder="Пароль (минимум 8 символов)" autocomplete="current-password"><button id="login">Войти</button><button id="signup" hidden>Создать новый акк</button></div></section>
<section id="invite" hidden><p>Для доступа нужен персональный код приглашения.</p><input id="code" placeholder="Код приглашения"><button id="redeem">Активировать</button></section>
<section id="member" hidden><h2 id="account-name">Моя галерея</h2><p>JPEG, PNG, GIF или WebP, до 10 МБ.</p><input id="file" type="file" accept="image/jpeg,image/png,image/gif,image/webp"><button id="upload">Загрузить</button><button id="refresh">Обновить</button><p id="gallery-state" role="status"></p><div id="gallery" class="grid"></div></section>
<button id="logout" hidden>Выйти</button><p id="status" role="status"></p>
<script type="module" src="app.js?v=5"></script></html>
